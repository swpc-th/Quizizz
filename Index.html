<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>กิจกรรมตอบคำถามประจำเดือน - สภาวิชาชีพสังคมสงเคราะห์</title>
  <meta name="description" content="ร่วมตอบคำถามประจำเดือน ลุ้นรับของรางวัล สำหรับสมาชิกสภาวิชาชีพสังคมสงเคราะห์">
  <meta property="og:title" content="กิจกรรมตอบคำถามประจำเดือน - สภาวิชาชีพสังคมสงเคราะห์">
  <meta property="og:description" content="ร่วมตอบคำถามประจำเดือน ลุ้นรับของรางวัล สำหรับสมาชิกสภาวิชาชีพสังคมสงเคราะห์">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#2b2a6e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #f6f4ff; font-family: 'Prompt', sans-serif; color: #1f1d4d; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
              background: linear-gradient(135deg, #2b2a6e, #5b3fd0 60%, #ff6b5b); color: #fff; transition: opacity .4s; }
    #loader.done { opacity: 0; pointer-events: none; }
    .spin { width: 44px; height: 44px; border: 4px solid rgba(255, 255, 255, .3); border-top-color: #ffc83d; border-radius: 50%; animation: s 0.9s linear infinite; margin: 0 auto 14px; }
    @keyframes s { to { transform: rotate(360deg); } }
    #fallback { display: none; margin-top: 16px; }
    #fallback a { display: inline-block; background: #ffc83d; color: #2b2a6e; font-weight: 600; text-decoration: none; padding: 12px 22px; border-radius: 14px; }
    #setup { display: none; max-width: 420px; background: #fff; color: #1f1d4d; border-radius: 20px; padding: 24px; text-align: left; line-height: 1.7; }
    code { background: #efecfb; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>

<div id="loader" role="status" aria-live="polite">
  <div id="wait"><div class="spin"></div><div>กำลังเปิดกิจกรรม...</div>
    <div id="fallback"><p style="margin:0 0 10px">ใช้เวลานานกว่าปกติ</p><a id="direct" href="#" rel="noopener">เปิดกิจกรรมในหน้าใหม่</a></div>
  </div>
  <div id="setup"><b>ยังไม่ได้ตั้งค่าลิงก์</b><br>เปิดไฟล์ <code>index.html</code> แล้วแก้ค่า <code>SCRIPT_URL</code> ให้เป็นลิงก์ Web app ของ Google Apps Script (ลงท้ายด้วย <code>/exec</code>)</div>
</div>

<iframe id="app" title="กิจกรรมตอบคำถามประจำเดือน" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  /* ============ ตั้งค่าตรงนี้เท่านั้น ============ */
  // วางลิงก์ Web app ของ Google Apps Script (Deploy > Manage deployments > Web app URL)
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8-Y27qHB96Z-pRQqqzUYUelak8sI7Qp7VbI28LUl-SVWe60LlcyrQJwVVHgSpj24/exec';
  // 'iframe'   = แสดงในหน้านี้ ที่อยู่ในแถบเบราว์เซอร์ยังเป็นลิงก์ GitHub (แนะนำ)
  // 'redirect' = พาไปที่ลิงก์ Google Script โดยตรง (ใช้หากบางเบราว์เซอร์แสดงใน iframe ไม่ได้)
  var MODE = 'iframe';
  /* ============================================== */

  function $(id) { return document.getElementById(id); }
  var ok = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(SCRIPT_URL);

  if (!ok) {
    $('wait').style.display = 'none'; $('setup').style.display = 'block'; $('app').style.display = 'none';
  } else {
    // ส่งต่อพารามิเตอร์ เช่น ?page=admin ไปยังระบบหลังบ้าน
    var target = SCRIPT_URL + (location.search || '');
    $('direct').href = target;
    if (MODE === 'redirect') {
      location.replace(target);
    } else {
      var frame = $('app'), loaded = false;
      frame.addEventListener('load', function () { loaded = true; $('loader').classList.add('done'); setTimeout(function () { $('loader').style.display = 'none'; }, 450); });
      frame.src = target;
      setTimeout(function () { if (!loaded) $('fallback').style.display = 'block'; }, 12000);
    }
  }
</script>
</body>
</html>
